
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GK Quiz Application</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #edf2f8;
    padding: 30px 12px;
}

.container {
    background: white;
    max-width: 700px;
    margin: auto;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 5px 20px #0002;
}

h1 {
    text-align: center;
    color: #234b91;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: gray;
    margin-bottom: 25px;
}

.subjects {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.subject {
    background: #edf3ff;
    padding: 22px 10px;
    border-radius: 10px;
    text-align: center;
    cursor: pointer;
    color: #234b91;
    font-size: 17px;
    font-weight: bold;
    border: 2px solid transparent;
}

.subject:hover {
    background: #dce8ff;
    border-color: #234b91;
}

.subject span {
    display: block;
    font-size: 30px;
    margin-bottom: 8px;
}

button {
    background: #234b91;
    color: white;
    border: none;
    padding: 12px 22px;
    border-radius: 7px;
    cursor: pointer;
    margin-top: 20px;
    font-size: 15px;
}

button:hover {
    background: #16366e;
}

.back {
    background: #666;
}

.hidden {
    display: none;
}

.info {
    display: flex;
    justify-content: space-between;
    margin: 20px 0;
    font-weight: bold;
}

.progress {
    background: #ddd;
    height: 8px;
    border-radius: 10px;
    margin-bottom: 25px;
}

.progress-bar {
    background: #2878e5;
    height: 8px;
    border-radius: 10px;
    width: 0%;
}

#question {
    margin-bottom: 20px;
    font-size: 20px;
}

.option {
    background: #f1f4f9;
    padding: 14px;
    margin: 10px 0;
    border-radius: 8px;
    cursor: pointer;
    border: 2px solid transparent;
}

.option:hover {
    background: #e1eaff;
}

.correct {
    background: #d4edda !important;
    border-color: green !important;
}

.wrong {
    background: #f8d7da !important;
    border-color: red !important;
}

.disabled {
    pointer-events: none;
}

#feedback {
    margin-top: 15px;
    font-weight: bold;
    line-height: 1.5;
}

#nextBtn {
    float: right;
    display: none;
}

#result {
    text-align: center;
}

#result h2 {
    color: #234b91;
    margin-bottom: 20px;
}

#score {
    font-size: 28px;
    color: green;
    margin: 20px;
}

@media(max-width:450px) {
    .container {
        padding: 20px;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>GK QUIZ APPLICATION</h1>
<p class="subtitle">Choose Your Subject & Test Your Knowledge</p>

<!-- HOME PAGE -->

<div id="home">

<h3 style="margin-bottom:15px;">Select Your Subject</h3>

<div class="subjects">

<div class="subject" onclick="startQuiz('History')">
<span>🏛️</span>History
</div>

<div class="subject" onclick="startQuiz('Geography')">
<span>🌍</span>Geography
</div>

<div class="subject" onclick="startQuiz('Science')">
<span>🔬</span>Science
</div>

<div class="subject" onclick="startQuiz('Polity')">
<span>⚖️</span>Indian Polity
</div>

<div class="subject" onclick="startQuiz('Economics')">
<span>💰</span>Economics
</div>

<div class="subject" onclick="startQuiz('Sports')">
<span>🏆</span>Sports
</div>

<div class="subject" onclick="startQuiz('Computer')">
<span>💻</span>Computer
</div>

<div class="subject" onclick="startQuiz('Current Affairs')">
<span>📰</span>Current Affairs
</div>

</div>
</div>


<!-- QUIZ PAGE -->

<div id="quiz" class="hidden">

<button class="back" onclick="goHome()">Home</button>

<h2 id="subjectName"></h2>

<div class="info">
<span id="questionNumber"></span>
<span id="scoreDisplay">Score: 0</span>
</div>

<div class="progress">
<div class="progress-bar" id="progressBar"></div>
</div>

<h3 id="question"></h3>

<div id="options"></div>

<p id="feedback"></p>

<button id="nextBtn" onclick="nextQuestion()">
Next Question
</button>

</div>


<!-- RESULT PAGE -->

<div id="result" class="hidden">

<h2>Quiz Completed!</h2>

<p id="resultSubject"></p>

<div id="score"></div>

<p id="message"></p>

<button onclick="restartQuiz()">Try Again</button>

<button onclick="goHome()">Home</button>

</div>

</div>

// VARIABLES

let currentSubject = "";
let questions = [];
let currentQuestion = 0;
let score = 0;
let answered = false;


// RANDOM QUESTIONS FUNCTION

function shuffle(array) {

    let shuffled = [...array];

    for(let i = shuffled.length - 1; i > 0; i--) {

        let j = Math.floor(Math.random() * (i + 1));

        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];

    }

    return shuffled;

}


// START QUIZ

function startQuiz(subject) {

    currentSubject = subject;

    // Random 10 questions (or all available if fewer)
    questions = shuffle(quizData[subject]).slice(0, 10);

    currentQuestion = 0;
    score = 0;

    document.getElementById("home").classList.add("hidden");
    document.getElementById("quiz").classList.remove("hidden");
    document.getElementById("result").classList.add("hidden");

    document.getElementById("subjectName").innerText =
    subject + " Quiz";

    document.getElementById("nextBtn").innerText = "Next Question";

    loadQuestion();

}


// LOAD QUESTION

function loadQuestion() {

    answered = false;

    let q = questions[currentQuestion];

    document.getElementById("questionNumber").innerText =
    "Question " + (currentQuestion + 1) + "/" + questions.length;

    document.getElementById("scoreDisplay").innerText =
    "Score: " + score;

    document.getElementById("question").innerText = q.question;

    document.getElementById("progressBar").style.width =
    (currentQuestion / questions.length * 100) + "%";

    document.getElementById("feedback").innerText = "";

    document.getElementById("nextBtn").style.display = "none";

    let optionsDiv = document.getElementById("options");

    optionsDiv.innerHTML = "";

    q.options.forEach((option, index) => {

        let div = document.createElement("div");

        div.className = "option";
        div.innerText = option;

        div.onclick = function() {
            checkAnswer(index, div);
        };

        optionsDiv.appendChild(div);

    });

}


// CHECK ANSWER

function checkAnswer(selected, element) {

    if(answered) return;

    answered = true;

    let correct = questions[currentQuestion].answer;

    let allOptions = document.querySelectorAll(".option");

    allOptions.forEach((option, index) => {

        option.classList.add("disabled");

        if(index === correct) {
            option.classList.add("correct");
        }

    });

    if(selected === correct) {

        score++;

        document.getElementById("feedback").innerText =
        "Correct Answer!";

        document.getElementById("feedback").style.color = "green";

    } else {

        element.classList.add("wrong");

        document.getElementById("feedback").innerText =
        "Wrong Answer! Correct Answer: " +
        questions[currentQuestion].options[correct];

        document.getElementById("feedback").style.color = "red";

    }

    document.getElementById("scoreDisplay").innerText =
    "Score: " + score;

    document.getElementById("nextBtn").style.display = "block";

    if(currentQuestion === questions.length - 1) {

        document.getElementById("nextBtn").innerText = "Show Result";

    }

}


// NEXT QUESTION

function nextQuestion() {

    currentQuestion++;

    if(currentQuestion < questions.length) {

        loadQuestion();

    } else {

        showResult();

    }

}


// SHOW RESULT

function showResult() {

    document.getElementById("quiz").classList.add("hidden");

    document.getElementById("result").classList.remove("hidden");

    document.getElementById("resultSubject").innerText =
    "Subject: " + currentSubject;

    document.getElementById("score").innerText =
    score + " / " + questions.length;

    let percentage = (score / questions.length) * 100;

    if(percentage >= 80) {

        document.getElementById("message").innerText =
        "Excellent Performance!";

    } else if(percentage >= 50) {

        document.getElementById("message").innerText =
        "Good Job! Keep Practicing.";

    } else {

        document.getElementById("message").innerText =
        "Keep Learning and Try Again!";

    }

}


// RESTART QUIZ

function restartQuiz() {

    startQuiz(currentSubject);

}


// HOME PAGE

function goHome() {

    document.getElementById("quiz").classList.add("hidden");

    document.getElementById("result").classList.add("hidden");

    document.getElementById("home").classList.remove("hidden");

}

</script>
